<!DOCTYPE html>
<html>
<head>
    <title>Patient Monitoring</title>
</head>
<body>

<h2>Enter Patient Vitals</h2>

<form action="/add" method="POST">

    Temperature:
    <input type="number" step="0.1" name="temperature" required>
    <br><br>

    SpO2:
    <input type="number" name="spo2" required>
    <br><br>

    RR:
    <input type="number" name="rr" required>
    <br><br>

    <button type="submit">Save</button>

</form>

<br>
<a href="/view">View All Records</a>

</body>
</html>
