<!DOCTYPE html>
<html>
<head>
    <title>Patient Monitor</title>
</head>
<body>

<h1>Patient Monitoring System</h1>

<a href="/patients">View Patients</a>

<hr>

<h3>Add Patient Vitals</h3>

<form action="/vitals" method="post">

    Patient ID:
    <input type="text" name="patient_id" required>
    <br><br>

    Temperature:
    <input type="number" step="0.1" name="temperature" required>
    <br><br>

    SpO2:
    <input type="number" name="spo2" required>
    <br><br>

    RR:
    <input type="number" name="rr" required>
    <br><br>

    <button type="submit">Save</button>

</form>

</body>
</html>
